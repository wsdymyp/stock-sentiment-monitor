name: 24/7 Sentiment Manipulation Monitor

on:
  workflow_dispatch:
    inputs:
      use_mock:
        description: "Run offline mock scenarios to verify webhook/alerts"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sentiment-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sentiment manipulation scan
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TYPE: ${{ secrets.WEBHOOK_TYPE }}
          NONEBOT_API_URL: ${{ secrets.NONEBOT_API_URL }}
          NONEBOT_GROUP_ID: ${{ secrets.NONEBOT_GROUP_ID }}
          NONEBOT_TOKEN: ${{ secrets.NONEBOT_TOKEN }}
          WATCHLIST: ${{ secrets.WATCHLIST }}
          RISK_THRESHOLD: ${{ secrets.RISK_THRESHOLD }}
        run: |
          if [ "${{ inputs.use_mock }}" = "true" ]; then
            python3 run_local.py --db data/monitor_data.db --mock
          else
            python3 run_local.py --db data/monitor_data.db
          fi

      - name: Persist SQLite state to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/monitor_data.db
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): update monitor_data.db [skip ci]"
            git pull --rebase
            git push
          else
            echo "No DB changes to commit."
          fi
